<!DOCTYPE html>
<section class="card wizard">
<div id="stepIndicator"></div>
<h2 id="stepTitle"></h2>
<p id="stepText"></p>
<p class="tip" id="stepTip"></p>


<div id="stepTimers" class="timer-buttons"></div>


<div class="nav-buttons">
<button id="prevBtn">← Anterior</button>
<button id="nextBtn">Siguiente →</button>
</div>


<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
</section>


<!-- INGREDIENTES -->
<section class="card">
<h3>🧺 Ingredientes</h3>
<div id="ingredients"></div>
<div class="actions">
<button id="checkAll">Marcar todo</button>
<button id="resetChecks">Reiniciar</button>
</div>
</section>


<!-- TIMERS ACTIVOS -->
<section class="card">
<h3>⏱️ Temporizadores activos</h3>
<label><input type="checkbox" id="muteToggle"> Silenciar</label>
<div id="timers"></div>
</section>


<!-- MODO FAMILIA -->
<section class="card">
<h3>👨‍👩‍👧‍👦 Modo Familia</h3>
<input id="familyNames" placeholder="Ej: Ana, Luis, Sofía" />
<button id="spinWheel">🎡 Ruleta del Chef</button>
<p id="chefResult"></p>
</section>


<!-- MOMENTOS (COLAPSADO) -->
<section class="card">
<details>
<summary>📝 Momentos de la Noche</summary>
<textarea id="notes" placeholder="Recuerdos, chistes, brindis..."></textarea>
<input type="file" id="photoInput" accept="image/*" />
<div id="photoPreview"></div>
</details>
</section>


</main>


<footer class="footer">
<button onclick="document.body.classList.toggle('clean')">Modo limpio</button>
<button onclick="window.print()">Imprimir</button>
</footer>


<script src="script.js"></script>
</body>
</html>
